name: DustUI R36 native hosted Android debug acceptance (non-release)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dustui-r36-hosted-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reviewed-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DEVTOOL_SOURCE_SHA: 246f168ebdef6d9b25c194268c810c877d099fa3
      PYTHONDONTWRITEBYTECODE: '1'
      GOTOOLCHAIN: local
    steps:
      - name: Checkout DustUI exact triggering source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python for pinned Devtool
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Go for arm64-v8a native runtime
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: JDK 21 for Android Gradle Plugin
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Reviewed Android SDK and build tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: 15859902
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - name: Pinned NDK for DustUI Go runtime packaging
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;28.2.13676358'
      - name: Reviewed Gradle execution host
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Acquire immutable R36 Devtool runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/devtool-source"
          git -C "$RUNNER_TEMP/devtool-source" checkout --detach "$DEVTOOL_SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/devtool-source" rev-parse HEAD)" = "$DEVTOOL_SOURCE_SHA"
          python3 -m venv "$RUNNER_TEMP/devtool-venv"
          "$RUNNER_TEMP/devtool-venv/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP/devtool-source"
      - name: Verify source-bound R36 provider plan (no Gradle)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devtool-venv/bin/python" scripts/dustui_r36_hosted.py plan \
            --root "$GITHUB_WORKSPACE" --evidence "$RUNNER_TEMP/dustui-r36/plan.json"
      - name: Run exact reviewed native DAG node through Devtool
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devtool-venv/bin/python" scripts/dustui_r36_hosted.py run \
            --root "$GITHUB_WORKSPACE" \
            --inputs "$RUNNER_TEMP/rm06-inputs" \
            --outputs "$RUNNER_TEMP/rm06-output"
      - name: Upload reviewed debug APK and native DAG receipt (not release)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dustui-r36-debug-native-dag-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/rm06-output/node-01/
          if-no-files-found: error
          retention-days: 7
      - name: Upload source review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dustui-r36-plan-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/dustui-r36/plan.json
          if-no-files-found: error
          retention-days: 7
