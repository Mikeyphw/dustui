name: DustUI M04 hosted Android debug via Devtool (non-release)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dustui-m04-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  debug-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      DEVTOOL_SOURCE_SHA: b164463db51e2cffd12f753043b9e55a08cc43ae
      PYTHONDONTWRITEBYTECODE: '1'
      GOTOOLCHAIN: local
    steps:
      - name: Checkout exact DustUI source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Node24-compatible Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Go compiler for packaged Android arm64 runtime
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go/go.mod
          cache: false
      - name: JDK 21 for AGP 9
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Reviewed Android SDK platform and build-tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: 15859902
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Pinned NDK for native Go runtime packaging
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;28.2.13676358'
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
      - name: Reviewed Gradle wrapper and cache policy
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-disabled: true
      - name: Acquire exact reviewed Devtool runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/devtool-source"
          git -C "$RUNNER_TEMP/devtool-source" checkout --detach "$DEVTOOL_SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/devtool-source" rev-parse HEAD)" = "$DEVTOOL_SOURCE_SHA"
          python3 -m venv "$RUNNER_TEMP/devtool-venv"
          "$RUNNER_TEMP/devtool-venv/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP/devtool-source"
      - name: Validate frozen source-bound native Android plan (no Gradle)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devtool-venv/bin/python" scripts/dustui_m04_hosted.py plan \
            --root "$GITHUB_WORKSPACE" --evidence "$RUNNER_TEMP/dustui-m04/plan.json"
      - name: Execute native Devtool debug unit, lint, and APK node
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devtool-venv/bin/python" scripts/dustui_m04_hosted.py run \
            --root "$GITHUB_WORKSPACE" \
            --inputs "$RUNNER_TEMP/rm06-inputs" --outputs "$RUNNER_TEMP/rm06-output"
      - name: Inspect packaged Go ELF, ABI, application ID and debug signer
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/rm06-evidence/node-01/node-evidence.json"
          GRAPH_SHA="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["graph_sha256"])' "$RUNNER_TEMP/dustui-m04/plan.json")"
          python3 scripts/dustui_m04_verify_apk.py \
            --apk "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk" \
            --test-results "$GITHUB_WORKSPACE/android/app/build/test-results/testDebugUnitTest" \
            --output "$RUNNER_TEMP/dustui-m04/apk-inspection.json" \
            --source-sha "$GITHUB_SHA" --graph-sha "$GRAPH_SHA" \
            --devtool-sha "$DEVTOOL_SOURCE_SHA"
      - name: Upload native Devtool debug APK and its typed receipt (not release)
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dustui-m04-debug-apk-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/rm06-output/node-01/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source plan and APK verification receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dustui-m04-evidence-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dustui-m04/
            ${{ runner.temp }}/rm06-evidence/
          if-no-files-found: warn
          retention-days: 14
