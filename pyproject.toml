[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dust-tui"
version = "0.1.0"
description = "A responsive Textual interface for the dust disk-space analyzer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dust-tui contributors" }]
keywords = ["dust", "disk-usage", "textual", "tui", "terminal"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Filesystems",
]
dependencies = [
  "textual>=1.0,<7",
  "send2trash>=1.8.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
]

[project.scripts]
dust-tui = "dust_tui.__main__:main"
dust-space = "dust_tui.__main__:main"

[project.urls]
Homepage = "https://github.com/bootandy/dust"

[tool.hatch.build.targets.wheel]
packages = ["src/dust_tui"]

[tool.hatch.build]
include = [
  "src/dust_tui/**/*.py",
  "src/dust_tui/**/*.tcss",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
