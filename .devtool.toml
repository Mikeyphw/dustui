inputs = ["scripts/refresh_qualification_state.py", "scripts/audfix01_core.py", "migration/qualification/v1", "migration/requirements/v2/requirements.json", ".devtool.toml"]
[targets.dustui_android.jobs.qualification_state.metadata]
