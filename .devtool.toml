[wrapper]
schema = 1
default_command = "aud-fix-07"

[wrapper.commands.aud-fix-07]
description = "Run DustUI AUD-FIX-07 Go host cutover and parity workflow"
workflow = "aud_fix_07"
target = "dustui_android"
aliases = ["host-cutover", "go-host"]

[wrapper.commands.authority-r1]
description = "Run DustUI AUD-FIX-06 Authority Convergence Gate R1 through the native EXO DAG"
workflow = "authority_gate_r1"
target = "dustui_android"
aliases = ["r1", "aud-fix-gate"]

[wrapper.commands.aud-fix-05]
description = "Run the AUD-FIX-05 diagnostics/support authority workflow"
workflow = "aud_fix_05"
target = "dustui_android"
aliases = ["diag-authority"]

[wrapper.commands.gate-d]
description = "Compatibility audit alias only; Gate D remains open until AUD-FIX-15"
workflow = "gate_d"
target = "dustui_android"
aliases = ["gate", "validate-gate"]

[wrapper.commands.cutover-audit]
description = "Audit actual Android/Go cutover truth without claiming Gate D closure"
workflow = "cutover_audit"
target = "dustui_android"
aliases = ["truth"]

[wrapper.commands.fast]
description = "Run the DustUI fast OV13 evidence workflow"
workflow = "fast"
target = "dustui_android"
aliases = ["f"]

[wrapper.commands.unit]
description = "Run Android debug unit tests through the EXO target-local unit job"
workflow = "unit"
target = "dustui_android"
aliases = ["test-unit"]

[wrapper.commands.go-fast]
description = "Run Go test, product contract, and schema evidence"
workflow = "fast"
target = "dustui_go"
aliases = ["go"]

[wrapper.commands.build]
description = "Build the Android debug target using Devtool"
devtool = "build"
target = "dustui_android"
allow_passthrough = true

[wrapper.commands.test]
description = "Run the Android target test action using Devtool"
devtool = "test"
target = "dustui_android"
allow_passthrough = true

[wrapper.commands.lint]
description = "Run Android lint using Devtool"
devtool = "lint"
target = "dustui_android"

