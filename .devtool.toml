# DustUI Devtool orchestration: current capabilities, no migration gate history.
# Source-only/local actions: Go + Python contracts. Android Gradle: GitHub Actions only.
[workspace]
default_target = "dustui_go"

[workspace.scheduler]
parallel = true
max_parallel_nodes = 2
max_gradle_nodes = 1
max_dotnet_nodes = 1

[execution]
environment = "auto"

# Termux and desktop: Go development only. No Android Gradle jobs or tasks.
[targets.dustui_go]
type = "go"
root = "go"
execution_environment = "auto"
inputs = ["."]

[targets.dustui_go.tasks]
test = ["go", "test", "./..."]
build = ["go", "build", "./..."]

[targets.dustui_go.jobs.source]
runner = "command"
root = ".."
command = ["python3", "scripts/devtool_actions_contract.py"]
inputs = [".devtool.toml", "scripts/devtool_actions_contract.py", "docs/ci/DEVTOOL_ORCHESTRATION.md"]
outputs = []

[targets.dustui_go.jobs.source.metadata]
read_only = true

[targets.dustui_go.jobs.test]
runner = "command"
command = ["go", "test", "./..."]
inputs = ["."]
outputs = []
metadata = { resource_class = "cpu-heavy" }

[targets.dustui_go.jobs.vet]
runner = "command"
command = ["go", "vet", "./..."]
inputs = ["."]
outputs = []
metadata = { resource_class = "cpu-heavy" }

[targets.dustui_go.jobs.build]
runner = "command"
command = ["go", "build", "./..."]
inputs = ["."]
outputs = []
metadata = { resource_class = "cpu-heavy" }

[targets.dustui_go.workflows]
ci-preflight = ["job:source"]
go-test = ["job:test"]
go-vet = ["job:vet"]
go-build = ["job:build"]
go-fast = ["job:test", "job:vet"]
ci-local = [
  { id = "source", ref = "job:source", depends_on = [] },
  { id = "test", ref = "job:test", depends_on = ["source"] },
  { id = "vet", ref = "job:vet", depends_on = ["source"] },
  { id = "build", ref = "job:build", depends_on = ["test", "vet"] },
]

# M03 reviewed hosted-Go native DAG. GitHub-owned source-only verification.
# No cross-run output reuse, signing, device or release authority.
[targets.dustui_hosted_go]
runner = "go"
root = "."
execution_environment = "auto"

[targets.dustui_hosted_go.jobs.test]
runner = "go"
command = ["go", "-C", "go", "test", "./..."]
inputs = ["go/go.mod", "go/go.sum"]
outputs = []
metadata = { ci_toolchain = "go", resource_class = "cpu-heavy" }

[targets.dustui_hosted_go.jobs.vet]
runner = "go"
command = ["go", "-C", "go", "vet", "./..."]
inputs = ["go/go.mod", "go/go.sum"]
outputs = []
metadata = { ci_toolchain = "go", resource_class = "cpu-heavy" }

[targets.dustui_hosted_go.jobs.build]
runner = "go"
command = ["go", "-C", "go", "build", "./..."]
inputs = ["go/go.mod", "go/go.sum"]
outputs = []
metadata = { ci_toolchain = "go", resource_class = "cpu-heavy" }

[targets.dustui_hosted_go.jobs.race]
runner = "go"
command = ["go", "-C", "go", "test", "-race", "./..."]
inputs = ["go/go.mod", "go/go.sum"]
outputs = []
metadata = { ci_toolchain = "go", resource_class = "cpu-heavy" }

[targets.dustui_hosted_go.jobs.race.env]
GOOS = "linux"
GOARCH = "amd64"
CGO_ENABLED = "1"

[targets.dustui_hosted_go.workflows]
ci = [
  { id = "test", ref = "job:test", depends_on = [] },
  { id = "vet", ref = "job:vet", depends_on = [] },
  { id = "race", ref = "job:race", depends_on = [] },
  { id = "build", ref = "job:build", depends_on = ["test", "vet", "race"] },
]

# R36 GitHub debug APK compatibility island, byte-for-byte semantic identity.
# Remove only after a real M04 hosted Android successor succeeds.
[targets.dustui_hosted_r36]
runner = "android"
root = "android"
execution_environment = "auto"

[targets.dustui_hosted_r36.jobs.debug_apk]
runner = "android"
gradle_tasks = [":app:lintDebug", ":app:assembleDebug"]
outputs = ["android/app/build/outputs/apk/debug/app-debug.apk"]
metadata = { ci_toolchain = "android-gradle", ci_android_java_version = "21", ci_android_project_dir = "android", ci_android_debug_variant = "debug", ci_android_sdk_packages = ["platforms;android-36", "build-tools;36.0.0", "platform-tools"], ci_android_wrapper_jar_sha256 = "d3b261c2820e9e3d8d639ed084900f11f4a86050a8f83342ade7b6bc9b0d2bdd", ci_android_expected_output = "android/app/build/outputs/apk/debug/app-debug.apk" }

[targets.dustui_hosted_r36.workflows]
ci = ["job:debug_apk"]

# Wrapper v2: only safe local source/Go workflows. No local Android Gradle entry.
[wrapper]
schema = 2
default_command = "ci-preflight"

[wrapper.commands.ci-preflight]
description = "Validate Devtool source/wrapper contracts (no build, no device)"
workflow = "ci-preflight"
target = "dustui_go"
aliases = ["doctor-source"]

[wrapper.commands.ci-local]
description = "Go tests, vet and build with source preflight (no Gradle)"
workflow = "ci-local"
target = "dustui_go"
aliases = ["check"]

[wrapper.commands.go-fast]
description = "Go tests and vet without Android Gradle"
workflow = "go-fast"
target = "dustui_go"
aliases = ["fast"]

[wrapper.commands.go-test]
description = "Run all Go package tests"
workflow = "go-test"
target = "dustui_go"

[wrapper.commands.go-vet]
description = "Run static Go vet analysis"
workflow = "go-vet"
target = "dustui_go"

[wrapper.commands.go-build]
description = "Build Go packages (no APK)"
workflow = "go-build"
target = "dustui_go"
