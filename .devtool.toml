[workspace]
default_target = "dustui_android"

[project]
kind = "python"
name = "DustUI"
run_module = "dust_tui"

[execution]
environment = "auto"

[python]
manager = "auto"
test_framework = "pytest"
environment = ".devtool/venvs/python"
install_project = true
isolation = true

[targets.dustui_android]
type = "android"
root = "android"
execution_environment = "native-termux"
outputs = ["android/app/build", "android/build", "build/release-candidate", "build/final-rc", ".devtool"]
inputs = ["android", "migration", ".devtool.toml"]

[targets.dustui_android.android]
variant = "debug"
aapt2_provider = "auto"
instrumentation = "when-device-present"
prefer_native_termux = true

[targets.dustui_android.gradle]
version = "9.7.1"
provider = "auto"
max_workers = 2
parallel = true
no_daemon = false
daemon_idle_timeout_ms = 900000
build_cache = true
structured_events = true
fail_fast = false
offline = false
args = [
  "-Dorg.gradle.parallel=true",
  "-Dorg.gradle.vfs.watch=false",
  "-Pkotlin.incremental=true",
  "-Pkotlin.compiler.execution.strategy=in-process",
]

[targets.dustui_android.tasks]
build = [":app:assembleDebug"]
test = [":app:testDebugUnitTest"]
lint = [":app:lintDebug"]
clean = [":app:clean"]
instrumentation = [":app:connectedDebugAndroidTest"]
release_build = [":app:assembleRelease"]
release_test = [":app:testReleaseUnitTest"]
release_lint = [":app:lintRelease"]
release_plan = [":app:testReleaseUnitTest", ":app:lintRelease", ":app:assembleRelease"]
contract = ["verifyDustMigrationContract"]

[targets.dustui_android.artifacts]
required = true
external_verification = "auto"

[targets.dustui_android.validation]
android_safe = true
split_gradle = true
max_workers = 2
cpu_limit = 2
parallel = true
no_daemon = false
stop_daemon_after_phase = false
low_priority = false
memory_guard_mb = 512
gradle_heap_mb = 1152
gradle_metaspace_mb = 640
gradle_packaging_metaspace_mb = 640
gradle_lint_metaspace_mb = 640
affected_module_lint = true

[targets.dustui_android.metadata]
android_buildability = "mandatory"
gate = "Gate D - Android reconnect mandatory"
primary = true
migration_phase = "OV13"
structured_events = true
max_gradle_nodes = 1
abi_policy = "arm64-v8a production first; x86_64 is test-only until a matching Go runtime exists"
release_authority = "devtool"
gate_d_truth = "reopened-by-ov14-retirement-truth-audit"
ov15_status = "blocked-on-real-android-go-cutover"

[targets.dustui_go]
type = "go"
root = "go"
execution_environment = "native-termux"
outputs = ["go/bin", "go/build"]
inputs = ["go"]

[targets.dustui_go.metadata]
production_authority = true
migration_phase = "OV13"
readiness_only = false
product_default = true
go_cli_default = true
go_tui_default = true
android_reconnect_gate = "Gate D"
android_buildability = "mandatory"
legacy_python_textual_production = false
legacy_kotlin_domain_truth = false
state_protocol_kernel = true
query_history_engine = true
runtime_contract_gate = "Gate B"
privileged_runtime_boundary = true
cleanup_manifest_capability = true
mutation_authority = true
mutation_gate = "Gate C"
package_storage_authority = true
package_storage_protocol = "dustui.package.storage.evidence.v1"
cleanup_intelligence_authority = true
cleanup_intelligence_protocol = "dustui.cleanup.intelligence.v1"
automation_activity_authority = true
automation_activity_protocol = "dustui.automation.activity.v1"
diagnostics_evidence_authority = true
diagnostics_evidence_protocol = "dustui.diagnostics.evidence.v1"
privacy_bounded_support_bundle = true
workmanager_tasker_notification_ownership = "go-durable-operation"
duplicate_residue_rules_authority = "go"
legacy_destructive_executor = "none"
root_protocol = "dustui.privileged.runtime.v1"
read_authority = "go-sqlite"
android_runtime_packaging = "arm64-v8a-only"
shell_scaffold = true
production_authority_qualified = false
android_cutover_complete = false
go_sqlite_implementation = false

[targets.dustui_go.tasks]
test = ["go", "test", "./..."]
build = ["go", "build", "./cmd/dustui-go"]
readiness = ["go", "run", "./cmd/dustui-go", "readiness"]

[targets.dust_tui_legacy]
type = "python"
root = "."
execution_environment = "auto"

[targets.dust_tui_legacy.metadata]
compatibility_only = true
retire_by = "OV14"
parity_oracle_until = "OV13"

[targets.dust_tui_legacy.tasks]
test = ["pytest"]
lint = ["ruff", "check", "src", "tests"]
format_check = ["ruff", "format", "--check", "src", "tests"]
docs_check = ["python", "-m", "dust_tui", "--help"]
build = ["python", "-m", "build", "--no-isolation"]
smoke = ["python", "-m", "dust_tui", "--help"]

[targets.dust_tui_legacy.artifacts]
required = false
external_verification = "auto"

[targets.dust_tui_legacy.validation]
python_safe = true
low_priority = false
memory_guard_mb = 256

[targets.dustui_android.validation.phase_profiles.preflight]
max_workers = 1
cpu_limit = 1
gradle_heap_mb = 768
gradle_metaspace_mb = 640
memory_guard_mb = 384
no_daemon = false
low_priority = false


[targets.dustui_android.validation.phase_profiles.compile]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 640
memory_guard_mb = 512
no_daemon = false
low_priority = false


[targets.dustui_android.validation.phase_profiles.resources]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 640
memory_guard_mb = 512
no_daemon = false
low_priority = false


[targets.dustui_android.validation.phase_profiles.unit-test]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 640
memory_guard_mb = 512
no_daemon = false
low_priority = false


[targets.dustui_android.validation.phase_profiles.package]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 640
memory_guard_mb = 640
no_daemon = false
low_priority = false


[targets.dustui_android.validation.phase_profiles.lint]
max_workers = 1
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 640
memory_guard_mb = 640
no_daemon = false
low_priority = false


[targets.dustui_android.validation.phase_profiles.instrumentation]
max_workers = 1
cpu_limit = 2
gradle_heap_mb = 1024
gradle_metaspace_mb = 640
memory_guard_mb = 512
no_daemon = false
low_priority = false


[targets.dustui_android.validation.phases]
preflight = [
  "verifyStableToolchainBaseline",
  "verifyDustMigrationContract",
]
compile = [
  ":app:compileDebugSources",
]
resources = [
  ":app:processDebugResources",
]
unit-test = [
  ":app:testDebugUnitTest",
]
package = [
  ":app:assembleDebug",
]
lint = [
  ":app:lintDebug",
]

[targets.dustui_android.jobs.ov13_contract]
runner = "command"
root = ".."
command = ["python3", "scripts/validate_ov13_contract.py", "--audit-loop"]
inputs = ["scripts/validate_ov13_contract.py", "go", "migration", ".devtool.toml"]

[targets.dustui_android.jobs.retirement_audit]
runner = "command"
root = ".."
command = ["python3", "scripts/validate_ov14_retirement_truth_hotfix.py"]
inputs = ["scripts/validate_ov14_retirement_truth_hotfix.py", "android", "go", "migration", ".devtool.toml"]

[targets.dustui_android.jobs.retirement_gate]
runner = "command"
root = ".."
command = ["python3", "scripts/validate_ov14_retirement_truth_hotfix.py", "--gate"]
inputs = ["scripts/validate_ov14_retirement_truth_hotfix.py", "android", "go", "migration", ".devtool.toml"]

[targets.dustui_android.jobs.gradle_contract]
gradle_tasks = ["verifyDustMigrationContract"]

[targets.dustui_android.jobs.go_test]
runner = "command"
root = "../go"
command = ["go", "test", "./..."]
inputs = ["."]

[targets.dustui_android.jobs.android_unit]
gradle_tasks = [":app:testDebugUnitTest"]
outputs = ["app/build/test-results", "app/build/reports/tests"]

[targets.dustui_android.jobs.android_lint]
gradle_tasks = [":app:lintDebug"]
outputs = ["app/build/reports/lint-results-debug.html", "app/build/reports/lint-results-debug.xml"]

[targets.dustui_android.jobs.android_assemble]
gradle_tasks = [":app:assembleDebug"]
outputs = ["app/build/outputs/apk/debug"]

[targets.dustui_android.workflows]
fast = ["job:ov13_contract", "job:go_test", "job:android_unit"]
unit = ["job:android_unit"]
cutover_audit = ["job:retirement_audit"]
gate_d = ["job:retirement_gate", "job:ov13_contract", "job:go_test", "job:gradle_contract", "job:android_unit", "job:android_lint", "job:android_assemble"]
validate = ["job:retirement_gate", "job:ov13_contract", "job:go_test", "job:gradle_contract", "job:android_unit", "job:android_lint", "job:android_assemble"]

[targets.dustui_go.jobs.go_test]
runner = "command"
command = ["go", "test", "./..."]
inputs = ["."]

[targets.dustui_go.jobs.product_contract]
runner = "command"
command = ["go", "run", "./cmd/dustui-go", "product-contract"]
inputs = ["."]

[targets.dustui_go.jobs.tui_smoke]
runner = "command"
command = ["go", "run", "./cmd/dustui-go", "tui-smoke"]
inputs = ["."]

[targets.dustui_go.jobs.schema_contract]
runner = "command"
command = ["go", "run", "./cmd/dustui-go", "schema"]
inputs = ["."]

[targets.dustui_go.workflows]
fast = ["job:go_test", "job:product_contract", "job:tui_smoke", "job:schema_contract"]
validate = ["job:go_test", "job:product_contract", "job:tui_smoke", "job:schema_contract"]

[wrapper]
schema = 1
default_command = "gate-d"

[wrapper.commands.gate-d]
description = "Run DustUI Gate D through EXO target-local jobs"
workflow = "gate_d"
target = "dustui_android"
aliases = ["gate", "validate-gate"]

[wrapper.commands.cutover-audit]
description = "Audit actual Android/Go cutover truth without claiming Gate D closure"
workflow = "cutover_audit"
target = "dustui_android"
aliases = ["truth"]

[wrapper.commands.fast]
description = "Run the DustUI fast OV13 evidence workflow"
workflow = "fast"
target = "dustui_android"
aliases = ["f"]

[wrapper.commands.unit]
description = "Run Android debug unit tests through the EXO target-local unit job"
workflow = "unit"
target = "dustui_android"
aliases = ["test-unit"]

[wrapper.commands.go-fast]
description = "Run Go product contract, schema, TUI smoke, and go test evidence"
workflow = "fast"
target = "dustui_go"
aliases = ["go"]

[wrapper.commands.build]
description = "Build the Android debug target using Devtool"
devtool = "build"
target = "dustui_android"
allow_passthrough = true

[wrapper.commands.test]
description = "Run the Android target test action using Devtool"
devtool = "test"
target = "dustui_android"
allow_passthrough = true

[wrapper.commands.lint]
description = "Run Android lint using Devtool"
devtool = "lint"
target = "dustui_android"

