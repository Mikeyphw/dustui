[workspace]
default_target = "dustui_android"

[workspace.scheduler]
parallel = true
max_parallel_nodes = 3
max_gradle_nodes = 1
max_dotnet_nodes = 1


[execution]
environment = "auto"


[targets.dustui_android]
type = "android"
root = "android"
execution_environment = "native-termux"
outputs = ["app/build", "build", "../build/release-candidate", "../build/final-rc", ".devtool"]
inputs = ["app", "../go", "../migration", "../.devtool.toml"]

[targets.dustui_android.android]
variant = "debug"
aapt2_provider = "auto"
prefer_native_termux = true

[targets.dustui_android.android.instrumentation]
policy = "when-device-present"
test_runner = "com.mikeyphw.dustui.debug.test/androidx.test.runner.AndroidJUnitRunner"
target_package = "com.mikeyphw.dustui.debug"

[targets.dustui_android.android.release]
variant = "release"
unit_tests = true
lint = true
device_tests = "required"
install_smoke = true
upgrade_smoke = false
verify_signature = true
verify_certificate_identity = true

[targets.dustui_android.gradle]
version = "9.7.1"
provider = "auto"
max_workers = 2
parallel = true
no_daemon = false
daemon_idle_timeout_ms = 900000
build_cache = true
structured_events = true
fail_fast = false
offline = false
args = [
  "-Dorg.gradle.parallel=true",
  "-Dorg.gradle.vfs.watch=false",
  "-Pkotlin.incremental=true",
  "-Pkotlin.compiler.execution.strategy=in-process",
]

[targets.dustui_android.tasks]
build = [":app:assembleDebug"]
test = [":app:testDebugUnitTest"]
lint = [":app:lintDebug"]
clean = [":app:clean"]
instrumentation = [":app:connectedDebugAndroidTest"]
release_build = [":app:assembleRelease"]
release_test = [":app:test"]
release_lint = [":app:lintRelease"]
release_plan = [":app:test", ":app:lintRelease", ":app:assembleRelease"]
contract = ["verifyDustMigrationContract"]

[targets.dustui_android.artifacts]
required = true
external_verification = "auto"

[targets.dustui_android.validation]
android_safe = true
split_gradle = true
max_workers = 2
cpu_limit = 2
parallel = true
no_daemon = false
stop_daemon_after_phase = false
low_priority = false
memory_guard_mb = 512
gradle_heap_mb = 1152
gradle_metaspace_mb = 640
gradle_packaging_metaspace_mb = 640
gradle_lint_metaspace_mb = 640
affected_module_lint = true

[targets.dustui_android.metadata]
android_buildability = "mandatory"
gate = "Gate E - final qualification"
primary = true
migration_phase = "OV15"
structured_events = true
max_gradle_nodes = 1
abi_policy = "arm64-v8a production first; x86_64 is test-only until a matching Go runtime exists"
release_authority = "devtool"
qualification_state_source = "migration/qualification/v1/current_state.json"
qualification_evidence_source = "migration/qualification/v1/current_state.json"
acceptance_state_source = "migration/acceptance/v1/current_state.json"
android_domain_authority = "go-process+go-sqlite"
legacy_room_authority = false
go_sqlite_implementation = true

[targets.dustui_go]
type = "go"
root = "go"
execution_environment = "native-termux"
outputs = ["bin", "build"]
inputs = ["."]

[targets.dustui_go.metadata]
target_production_authority = true
migration_phase = "OV15"
readiness_only = false
target_product_default = true
target_product_default_scope = "host-cli-tui-only"
target_go_cli_default = true
target_go_tui_default = true
host_authority_default = true
legacy_python_textual_production = false
python_textual_oracle_archived = "migration/archive/oracles/aud_fix_16_python_textual"
android_reconnect_gate = "Gate E"
android_buildability = "mandatory"
legacy_python_observation_source = "migration/qualification/v1/current_state.json"
legacy_kotlin_observation_source = "migration/qualification/v1/current_state.json"
state_protocol_kernel = true
query_history_engine = true
runtime_contract_gate = "Gate B"
privileged_runtime_boundary = true
cleanup_manifest_capability = true
mutation_authority = true
mutation_gate = "Gate C"
package_storage_authority = true
package_storage_protocol = "dustui.package.storage.evidence.v1"
cleanup_intelligence_authority = true
cleanup_intelligence_protocol = "dustui.cleanup.intelligence.v1"
automation_activity_authority = true
automation_activity_protocol = "dustui.automation.activity.v2"
diagnostics_evidence_authority = true
diagnostics_evidence_protocol = "dustui.diagnostics.evidence.v1"
privacy_bounded_support_bundle = true
workmanager_tasker_notification_ownership = "go-durable-operation"
duplicate_residue_rules_authority = "go"
legacy_destructive_executor = "none"
root_protocol = "dustui.privileged.runtime.v1"
read_authority = "go-sqlite"
android_runtime_packaging = "arm64-v8a-only"
shell_scaffold = true
qualification_state_source = "migration/qualification/v1/current_state.json"
qualification_evidence_source = "migration/qualification/v1/current_state.json"
acceptance_state_source = "migration/acceptance/v1/current_state.json"
android_domain_authority = "go-process+go-sqlite"
legacy_room_authority = false
go_sqlite_implementation = true

[targets.dustui_go.tasks]
test = ["go", "test", "./..."]
build = ["go", "build", "./cmd/dustui-go"]
readiness = ["go", "run", "./cmd/dustui-go", "readiness"]


