root = ".."
command = ["python3", "scripts/validate_audfix03_contract.py"]
inputs = ["scripts/validate_audfix03_contract.py", "go/internal/authority", "go/internal/packageevidence", "go/internal/intelligence", "go/internal/state", "go/cmd/dustui-go", "android/app/src"]
[targets.dustui_android.jobs.audfix03_domain.metadata]
read_only = true

[targets.dustui_android.jobs.audfix04_operations]
