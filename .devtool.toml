inputs = ["scripts/validate_audfix07_contract.py", "go/internal/host", "go/internal/tui", "go/cmd", "scripts/install.sh", "scripts/run-dev.sh", "migration/oracle/python_textual", ".devtool.toml"]
[targets.dustui_android.jobs.audfix07_host_reachability.metadata]
