[targets.dustui_gate_a_history]
type = "command"
root = ".devtool/historical/gate-a"
execution_environment = "native-termux"
[targets.dustui_gate_a_history.jobs.contract]
runner = "command"
command = ["python3", "scripts/validate_ov03_contract.py", "--audit-loop"]
[targets.dustui_gate_a_history.jobs.go_test]
runner = "command"
root = "go"
command = ["sh", "-lc", 'mkdir -p .devtool/tmp/go-test && export TMPDIR="$PWD/.devtool/tmp/go-test"; MAIN_ROOT="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"; case "$PWD" in */.devtool/historical/*/go) MAIN_ROOT="${PWD%%/.devtool/historical/*}" ;; esac; python3 "$MAIN_ROOT/scripts/audfix15_termux_hardlink_compat.py" --root "$PWD" && go test ./...']
outputs = ["go/.devtool/tmp/go-test"]
[targets.dustui_gate_a_history.workflows]
requalify = [
  { id = "contract", ref = "job:contract", depends_on = [] },
  { id = "go_test", ref = "job:go_test", depends_on = ["contract"] },
]

