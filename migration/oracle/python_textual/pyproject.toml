# Root pyproject intentionally contains tooling-only configuration.
# Historical UI packaging metadata was archived under migration/oracle and migration/archive.
# Gate-D product authority is Go host + Android; root packaging is intentionally disabled.


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
